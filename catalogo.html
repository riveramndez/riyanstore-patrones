<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Riyan Store · Catálogo</title>
<meta name="description" content="Amigurumis tejidos a mano. Mira nuestros productos y pide por WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:title" content="Riyan Store · Catálogo">
<meta property="og:description" content="Amigurumis tejidos a mano. Mira nuestros productos y pide por WhatsApp.">
<meta property="og:image" content="https://riyanstore-patrones.pages.dev/imagenes/logo.jpg">
<meta property="og:url" content="https://riyanstore-patrones.pages.dev/catalogo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Riyan Store · Catálogo">
<meta name="twitter:description" content="Amigurumis tejidos a mano. Mira nuestros productos y pide por WhatsApp.">
<meta name="twitter:image" content="https://riyanstore-patrones.pages.dev/imagenes/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1E2A28;
    --surface:#2B3B37;
    --surface-2:#324540;
    --text:#F4EFE6;
    --text-dim:rgba(244,239,230,0.65);
    --accent:#E8A33D;
    --accent-ink:#2A1D06;
    --accent-2:#D9695A;
    --accent-3:#7FAE9A;
    --border:rgba(244,239,230,0.12);
    --font-display:'Fraunces', serif;
    --font-ui:'Inter', sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:28px 20px 20px;
    text-align:center;
    border-bottom:1px solid var(--border);
  }
  header h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:26px;
    margin:0 0 6px;
    color:var(--accent-3);
  }
  header p{
    margin:0;
    color:var(--text-dim);
    font-size:14px;
  }
  header a.wa-link{
    display:inline-block;
    margin-top:12px;
    color:var(--accent);
    text-decoration:none;
    font-weight:600;
    font-size:14px;
  }
  .search-wrap{
    padding:16px 20px 0;
    max-width:900px;
    margin:0 auto;
  }
  #search-input{
    width:100%;
    box-sizing:border-box;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:12px;
    padding:12px 14px;
    font-size:15px;
    font-family:var(--font-ui);
  }
  #search-input::placeholder{ color:var(--text-dim); }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:16px;
    padding:16px 20px 40px;
    max-width:900px;
    margin:0 auto;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    cursor:pointer;
    transition:transform 0.15s ease;
  }
  .card:active{ transform:scale(0.98); }
  .card-img-wrap{
    width:100%;
    aspect-ratio:1/1;
    background:var(--surface-2);
    overflow:hidden;
  }
  .card-img-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .card-body{ padding:10px 12px 12px; }
  .card-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:14.5px;
    margin:0 0 4px;
    line-height:1.25;
  }
  .card-price{
    color:var(--accent);
    font-weight:700;
    font-size:14px;
    margin:0;
  }
  .empty-msg{
    text-align:center;
    color:var(--text-dim);
    padding:60px 20px;
    font-size:14px;
  }
  /* Modal de detalle */
  .modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    z-index:50;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-overlay.active{ display:flex; }
  .modal-sheet{
    background:var(--bg);
    width:100%;
    max-width:480px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding-bottom:24px;
    animation:slideUp 0.2s ease;
  }
  @keyframes slideUp{ from{ transform:translateY(30px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .modal-close{
    display:flex; justify-content:flex-end;
    padding:10px 14px 0;
  }
  .modal-close button{
    background:none; border:none; color:var(--text-dim);
    font-size:22px; cursor:pointer; line-height:1;
    padding:4px 8px;
  }
  .modal-gallery{
    display:flex; gap:8px; overflow-x:auto;
    padding:0 16px 4px;
    scroll-snap-type:x mandatory;
  }
  .modal-gallery img{
    width:80%; flex:0 0 80%;
    aspect-ratio:1/1; object-fit:cover;
    border-radius:14px;
    scroll-snap-align:center;
    background:var(--surface-2);
  }
  .modal-body{ padding:16px 20px 0; }
  .modal-name{
    font-family:var(--font-display); font-weight:700;
    font-size:21px; margin:0 0 6px;
  }
  .modal-price{
    color:var(--accent); font-weight:700; font-size:18px;
    margin:0 0 12px;
  }
  .modal-desc{
    color:var(--text-dim); font-size:14px; line-height:1.5;
    margin:0 0 20px;
    white-space:pre-wrap;
  }
  .modal-wa-btn{
    display:block;
    text-align:center;
    background:#25D366;
    color:#0b2b18;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    padding:14px;
    border-radius:14px;
  }
  footer{
    text-align:center;
    padding:20px;
    color:var(--text-dim);
    font-size:12px;
  }
</style>
</head>
<body>
  <header>
    <h1 id="store-name">Catálogo</h1>
    <p id="store-sub">Toca un producto para ver más fotos y detalles</p>
    <a class="wa-link" id="store-wa-link" href="#" target="_blank" rel="noopener">📲 Escríbenos por WhatsApp</a>
  </header>

  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Buscar producto...">
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty-msg" id="empty-msg" style="display:none;">Aún no hay productos en el catálogo.</p>

  <footer id="footer-note"></footer>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-close"><button id="modal-close-btn">✕</button></div>
      <div class="modal-gallery" id="modal-gallery"></div>
      <div class="modal-body">
        <h2 class="modal-name" id="modal-name"></h2>
        <p class="modal-price" id="modal-price"></p>
        <p class="modal-desc" id="modal-desc"></p>
        <a class="modal-wa-btn" id="modal-wa-btn" href="#" target="_blank" rel="noopener">Pedir por WhatsApp</a>
      </div>
    </div>
  </div>

<script>
let allProducts = [];

function formatPrice(n){
  return '$' + Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' MXN';
}

function renderGrid(products){
  const grid = document.getElementById('grid');
  const emptyMsg = document.getElementById('empty-msg');
  grid.innerHTML = '';
  if(products.length === 0){
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';
  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-img-wrap"><img src="' + p.image + '" alt="' + escapeHtml(p.name) + '" loading="lazy"></div>' +
      '<div class="card-body">' +
        '<p class="card-name">' + escapeHtml(p.name) + '</p>' +
        '<p class="card-price">' + formatPrice(p.price) + '</p>' +
      '</div>';
    card.addEventListener('click', () => openModal(p));
    grid.appendChild(card);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function openModal(p){
  const overlay = document.getElementById('modal-overlay');
  const gallery = document.getElementById('modal-gallery');
  const allImages = [p.image].concat(Array.isArray(p.images) ? p.images : []);
  gallery.innerHTML = allImages.map(src => '<img src="' + src + '" alt="' + escapeHtml(p.name) + '" loading="lazy">').join('');
  document.getElementById('modal-name').textContent = p.name;
  document.getElementById('modal-price').textContent = formatPrice(p.price);
  document.getElementById('modal-desc').textContent = p.description || '';
  document.getElementById('modal-desc').style.display = p.description ? 'block' : 'none';
  const waBtn = document.getElementById('modal-wa-btn');
  waBtn.href = p.whatsappLink || '#';
  overlay.classList.add('active');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('active');
}
document.getElementById('modal-close-btn').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'modal-overlay') closeModal();
});

document.getElementById('search-input').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if(!q){ renderGrid(allProducts); return; }
  renderGrid(allProducts.filter(p => (p.name || '').toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q)));
});

fetch('catalogo.json?_=' + Date.now())
  .then(res => {
    if(!res.ok) throw new Error('no encontrado');
    return res.json();
  })
  .then(data => {
    document.getElementById('store-name').textContent = data.storeName || 'Catálogo';
    document.title = (data.storeName || 'Catálogo') + ' · Catálogo';
    if(data.storePhoneDigits){
      document.getElementById('store-wa-link').href = 'https://wa.me/' + data.storePhoneDigits;
    }
    allProducts = Array.isArray(data.products) ? data.products : [];
    renderGrid(allProducts);
    if(data.updatedAt){
      const d = new Date(data.updatedAt);
      document.getElementById('footer-note').textContent = 'Actualizado: ' + d.toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' });
    }
  })
  .catch(() => {
    document.getElementById('empty-msg').textContent = 'No se pudo cargar el catálogo. Intenta de nuevo más tarde.';
    document.getElementById('empty-msg').style.display = 'block';
  });
</script>
</body>
</html>
