<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Un mensaje para ti · Riyan Store</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Un mensaje para ti 💛">
<meta property="og:description" content="Hecho con cariño por Riyan Store.">
<meta property="og:image" content="https://riyanstore-patrones.pages.dev/imagenes/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1E2A28;
    --surface:#2B3B37;
    --text:#F4EFE6;
    --text-dim:rgba(244,239,230,0.65);
    --accent:#E8A33D;
    --accent-ink:#2A1D06;
    --accent-3:#7FAE9A;
    --border:rgba(244,239,230,0.12);
    --font-display:'Fraunces', serif;
    --font-ui:'Inter', sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  header{
    padding:30px 20px 18px;
    text-align:center;
  }
  .store-logo{
    width:84px;
    height:84px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--border);
    margin-bottom:12px;
  }
  header h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:26px;
    margin:0;
    color:var(--accent-3);
    line-height:1.2;
  }
  main{
    max-width:560px;
    margin:0 auto;
    padding:0 20px 40px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
  }
  .text-card{
    font-family:var(--font-display);
    font-size:19px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .media-label{
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 10px;
    font-weight:600;
  }
  .frame-16x9{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:12px;
    overflow:hidden;
    background:#000;
  }
  .frame-16x9 iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
  }
  iframe.audio{
    width:100%; height:150px; border:0; border-radius:12px; background:#000;
  }
  iframe.spotify{
    width:100%; height:152px; border:0; border-radius:12px;
  }
  .photo{
    width:100%;
    border-radius:12px;
    display:block;
  }
  .fallback{
    display:inline-block;
    margin-top:10px;
    color:var(--accent);
    font-size:13px;
    font-weight:600;
    text-decoration:none;
  }
  .btn{
    display:block;
    text-align:center;
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:700;
    text-decoration:none;
    border-radius:12px;
    padding:13px 16px;
    font-size:15px;
  }
  .state{
    text-align:center;
    color:var(--text-dim);
    padding:40px 20px;
    font-size:15px;
    line-height:1.5;
  }
  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    padding:0 20px 36px;
    line-height:1.6;
  }
  footer a{ color:var(--accent); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
  <header>
    <img class="store-logo" src="imagenes/logo.jpg" alt="Riyan Store" onerror="this.style.display='none'">
    <h1 id="page-title">Un mensaje para ti 💛</h1>
  </header>
  <main id="content">
    <div class="state" id="state-loading">Cargando tu mensaje…</div>
  </main>
  <footer id="page-footer">Hecho con cariño por <strong>Riyan Store</strong></footer>

<script>
(function(){
  var content = document.getElementById('content');

  function showState(msg){
    content.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'state';
    d.textContent = msg;
    content.appendChild(d);
  }

  // El código viene después del "?" -> /mensaje?k7x2p6  (también se acepta /mensaje?c=k7x2p6)
  function getCode(){
    var q = (location.search || '').replace(/^\?/, '');
    var m = q.match(/(?:^|&)c=([^&]+)/);
    var code = m ? m[1] : q.split('&')[0];
    code = (code || '').toLowerCase();
    return /^[a-z0-9]{4,16}$/.test(code) ? code : '';
  }

  function isHttps(u){ return /^https:\/\//i.test(u || ''); }

  function ytId(u){
    var m = (u || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/i);
    return m ? m[1] : '';
  }
  function driveId(u){
    var m = (u || '').match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/i) ||
            (u || '').match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([A-Za-z0-9_-]+)/i);
    return m ? m[1] : '';
  }
  function spotifyPath(u){
    var m = (u || '').match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/i);
    return m ? (m[1].toLowerCase() + '/' + m[2]) : '';
  }

  function card(label){
    var c = document.createElement('div');
    c.className = 'card';
    if(label){
      var p = document.createElement('p');
      p.className = 'media-label';
      p.textContent = label;
      c.appendChild(p);
    }
    content.appendChild(c);
    return c;
  }
  function iframe(src, cls, allow){
    var f = document.createElement('iframe');
    f.src = src;
    if(cls) f.className = cls;
    f.setAttribute('allow', allow || 'autoplay; encrypted-media; picture-in-picture; fullscreen');
    f.setAttribute('allowfullscreen', '');
    f.setAttribute('loading', 'lazy');
    f.setAttribute('referrerpolicy', 'no-referrer');
    return f;
  }
  function fallbackLink(parent, url, text){
    if(!isHttps(url)) return;
    var a = document.createElement('a');
    a.className = 'fallback';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = text;
    parent.appendChild(a);
  }
  function linkButton(parent, url, text){
    if(!isHttps(url)) return;
    var a = document.createElement('a');
    a.className = 'btn';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = text;
    parent.appendChild(a);
  }

  function renderItem(it){
    var t = it && it.t, u = (it && it.u || '').trim();
    if(!u || !isHttps(u)) return;

    if(t === 'video'){
      var c = card('🎬 Video');
      var y = ytId(u), d = driveId(u);
      if(y){
        var w = document.createElement('div'); w.className = 'frame-16x9';
        w.appendChild(iframe('https://www.youtube-nocookie.com/embed/' + y + '?rel=0&playsinline=1'));
        c.appendChild(w);
        fallbackLink(c, 'https://youtu.be/' + y, 'Si no se reproduce, ábrelo en YouTube');
      } else if(d){
        var w2 = document.createElement('div'); w2.className = 'frame-16x9';
        w2.appendChild(iframe('https://drive.google.com/file/d/' + d + '/preview'));
        c.appendChild(w2);
        fallbackLink(c, u, 'Si no se reproduce, ábrelo en Google Drive');
      } else {
        linkButton(c, u, 'Ver video');
      }
    } else if(t === 'audio'){
      var c2 = card('🎧 Audio');
      var d2 = driveId(u);
      if(d2){
        c2.appendChild(iframe('https://drive.google.com/file/d/' + d2 + '/preview', 'audio'));
        fallbackLink(c2, u, 'Si no se reproduce, ábrelo en Google Drive');
      } else {
        linkButton(c2, u, 'Escuchar audio');
      }
    } else if(t === 'photo'){
      var c3 = card('📷 Fotos');
      var d3 = driveId(u);
      var img = document.createElement('img');
      img.className = 'photo';
      img.alt = 'Foto';
      img.loading = 'lazy';
      img.src = d3 ? ('https://drive.google.com/thumbnail?id=' + d3 + '&sz=w1600') : u;
      img.onerror = function(){
        img.style.display = 'none';
        linkButton(c3, u, 'Ver foto');
      };
      c3.appendChild(img);
    } else if(t === 'song'){
      var c4 = card('🎵 Canción');
      var sp = spotifyPath(u), y2 = ytId(u);
      if(sp){
        c4.appendChild(iframe('https://open.spotify.com/embed/' + sp, 'spotify', 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture'));
        fallbackLink(c4, u, 'Abrir en Spotify');
      } else if(y2){
        var w3 = document.createElement('div'); w3.className = 'frame-16x9';
        w3.appendChild(iframe('https://www.youtube-nocookie.com/embed/' + y2 + '?rel=0&playsinline=1'));
        c4.appendChild(w3);
        fallbackLink(c4, 'https://youtu.be/' + y2, 'Si no se reproduce, ábrelo en YouTube');
      } else {
        linkButton(c4, u, 'Escuchar canción');
      }
    } else {
      var c5 = card('');
      linkButton(c5, u, 'Abrir enlace');
    }
  }

  function render(data){
    content.innerHTML = '';
    if(data.title) document.getElementById('page-title').textContent = data.title;
    if(data.title) document.title = data.title + ' · Riyan Store';

    if(data.text && data.text.trim()){
      var tc = card('');
      tc.className = 'card text-card';
      tc.textContent = data.text;
    }
    (data.items || []).forEach(renderItem);

    var digits = (data.wa || '').replace(/\D/g, '');
    if(digits){
      var f = document.getElementById('page-footer');
      var name = (data.storeName || 'Riyan Store');
      f.innerHTML = '';
      f.appendChild(document.createTextNode('Hecho con cariño por '));
      var s = document.createElement('strong'); s.textContent = name; f.appendChild(s);
      f.appendChild(document.createElement('br'));
      var a = document.createElement('a');
      a.href = 'https://wa.me/' + digits + '?text=' + encodeURIComponent('¡Hola! Me llegó mi mensaje y quiero uno igual 💛');
      a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = 'Pide el tuyo por WhatsApp';
      f.appendChild(a);
    }
    if(!content.children.length) showState('Este mensaje todavía no tiene contenido.');
  }

  var code = getCode();
  if(!code){ showState('Este enlace no es válido. Intenta escanear el código otra vez.'); return; }

  fetch('mensajes/' + code + '.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('nf'); return r.json(); })
    .then(render)
    .catch(function(){ showState('No encontramos este mensaje. Si acabas de recibirlo, espera unos minutos e inténtalo de nuevo.'); });
})();
</script>
</body>
</html>
